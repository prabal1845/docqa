# Render Blueprint: one Docker web service serving the API (/api) and the React app (/)
services:
  - type: web
    name: docqa
    runtime: docker
    plan: free
    region: singapore # same AWS region as the Neon database (ap-southeast-1)
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL # paste the Neon connection string when prompted
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: INGEST_MODE
        value: inline
